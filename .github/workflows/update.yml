name: Update cask

# Checks for a new TrackDeck release and updates Casks/trackdeck.rb.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "TrackDeck version (empty: the latest release)"
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Write the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-cask.sh ${{ inputs.version }}
      - name: Commit if it changed
        run: |
          if git diff --quiet; then echo "up to date"; exit 0; fi
          v=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/trackdeck.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "trackdeck $v"
          git push
